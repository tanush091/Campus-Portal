server.port=8080
server.ssl.enabled=false
spring.application.name=aiml
spring.datasource.url=jdbc:mysql://localhost:3306/employeedb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - override jwt.secret with the JWT_SECRET env var outside local dev (min 32 chars)
jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-1234567890}
jwt.expiration-ms=86400000
